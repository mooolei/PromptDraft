name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run core tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package portable app
        shell: pwsh
        run: ./scripts/package.ps1 -Offline
      - uses: actions/upload-artifact@v4
        with:
          name: PromptDraft-windows
          path: dist/*
          if-no-files-found: error
