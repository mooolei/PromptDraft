name: Publish Windows release

on:
  push:
    branches: [main]
    paths: ['.github/release-version.txt']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mooolei/PromptDraft' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and run core tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package portable app
        shell: pwsh
        run: ./scripts/package.ps1 -Offline
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content .github/release-version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $actual = (Get-Item .build/app/PromptDraft.exe).VersionInfo.FileVersion -replace '\.0$', ''
          if ($actual -ne $version) { throw 'Release version differs from the executable version' }
          $tag = "v$version"
          $archive = "dist/PromptDraft-$tag-windows.zip"
          if (!(Test-Path $archive) -or !(Test-Path "$archive.sha256")) { throw 'Release package missing' }
          $expected = ((Get-Content "$archive.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Package checksum mismatch' }
          gh release view $tag --json url
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; existing downloads will not be overwritten' }
          gh release create $tag $archive "$archive.sha256" --target $env:GITHUB_SHA --title "PromptDraft $tag" --notes-file .github/release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect the draft release' }
